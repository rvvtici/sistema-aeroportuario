<!DOCTYPE html>
<html>
<head>
    <title>Monitoramento Aeroporto</title>
</head>
<body>

<h1>Painel de Voos</h1>

<div id="voo"></div>

<script>
async function carregarVoo() {
    const response = await fetch('http://localhost:8080/api/voo/123');
    const data = await response.json();

    document.getElementById("voo").innerHTML = `
        <p>Status: ${data.status}</p>
        <p>Portão: ${data.portao}</p>
        <p>Horário: ${data.horario_saida}</p>
    `;
}

// atualiza a cada 3 segundos (simulando tempo real)
setInterval(carregarVoo, 3000);
</script>

</body>
</html>
