spring:
  datasource:
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 3000
      initialization-fail-timeout: 0
    url: ${DATABASE_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    url: ${DATABASE_URL}
    user: ${DB_USER}
    password: ${DB_PASSWORD}
  cassandra:
    contact-points: ${CASSANDRA_HOST}
    port: ${CASSANDRA_PORT}
    keyspace-name: airport_logs
    local-datacenter: datacenter1
    schema-action: CREATE_IF_NOT_EXISTS
    request:
      timeout: 10s
    connection:
      connection-timeout: 15s
      init-query-timeout: 15s
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}