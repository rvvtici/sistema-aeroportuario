## YAML Template.
---
spring:
  application:
    name: airport-management

  # ── PostgreSQL ──────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/airport
    username: postgres
    password:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate        # Flyway cuida do schema — JPA só valida
    show-sql: true              # Mostra queries no console (útil para debug)
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ── Flyway (migrations do PostgreSQL) ───────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── Cassandra ───────────────────────────────────────────────
  cassandra:
    contact-points: localhost
    port: 9042
    keyspace-name: airport_logs
    local-datacenter: datacenter1
    schema-action: CREATE_IF_NOT_EXISTS   # Cassandra cria o schema sozinho

  # ── Redis ───────────────────────────────────────────────────
  data:
    redis:
      host: localhost
      port: 6379

# ── Porta da API ────────────────────────────────────────────
server:
  port: 8080