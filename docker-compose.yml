services:
  postgres:
    image: postgres:15
    container_name: airport_postgres
    environment:
      POSTGRES_DB: airport
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  cassandra:
    image: cassandra:4.1
    container_name: airport_cassandra
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=airport_cluster
      - CASSANDRA_DC=datacenter1
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  cassandra-init:
    image: cassandra:4.1
    container_name: airport_cassandra_init
    depends_on:
      cassandra:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      cqlsh airport_cassandra -e "
        CREATE KEYSPACE IF NOT EXISTS airport_logs
        WITH replication = {
          'class': 'SimpleStrategy',
          'replication_factor': 1
        };
      "

  redis:
    image: redis:7
    container_name: airport_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  cassandra_data:
  redis_data: